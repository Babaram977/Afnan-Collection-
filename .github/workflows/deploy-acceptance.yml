name: Deploy Afnan acceptance

# Manual, owner-only deployment of an exact commit to the existing Access-protected
# acceptance Worker. Never triggered by push or pull_request.
#
# Security model:
# - Only the repository owner may dispatch (checked below), and the deploy job is gated
#   by the `afnan-acceptance` GitHub Environment (required reviewer, `main`-only branch policy).
# - The commit must be a full SHA contained in a branch of THIS repository, so commits that
#   exist only on fork pull-request refs are refused.
# - The build/test job runs the commit's code WITHOUT any secret. The deploy job, the only
#   job that receives CLOUDFLARE_API_TOKEN, installs dependencies with lifecycle scripts
#   disabled and uses a pinned Wrangler from this workflow, not the commit's.
# - Target, bindings and variables are fixed here, not read from the commit, so a commit
#   cannot redirect the deploy, add routes or change bindings. Access configuration is not
#   touched by this workflow.

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Full 40-character commit SHA to deploy (must be on a branch of this repository)"
        required: true
        type: string
      reason:
        description: "Why this commit is being deployed (recorded in the run and the Worker version message)"
        required: true
        type: string

run-name: "Acceptance deploy ${{ inputs.commit }} by ${{ github.actor }}"

permissions:
  contents: read

concurrency:
  group: afnan-acceptance-deploy
  cancel-in-progress: false

env:
  WRANGLER_VERSION: "4.160.0"
  NODE_VERSION: "24"
  BUN_VERSION: "1.4.4"

jobs:
  verify-and-build:
    name: Verify commit, test and build (no secrets)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Restrict to repository owner
        env:
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$ACTOR" != "$OWNER" ]; then
            echo "::error::Only the repository owner may deploy to Afnan acceptance (actor: $ACTOR)."
            exit 1
          fi

      - name: Validate commit input
        id: commit
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          if ! printf '%s' "$COMMIT" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::commit must be a full lowercase 40-character SHA."
            exit 1
          fi
          echo "sha=$COMMIT" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require commit to be on a branch of this repository
        env:
          COMMIT: ${{ steps.commit.outputs.sha }}
        run: |
          git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'
          branches=$(git branch -r --contains "$COMMIT" 2>/dev/null || true)
          if [ -z "$branches" ]; then
            echo "::error::$COMMIT is not contained in any branch of ${GITHUB_REPOSITORY}; refusing."
            exit 1
          fi
          git checkout --detach "$COMMIT"
          test "$(git rev-parse HEAD)" = "$COMMIT"
          {
            echo "### Commit"
            echo "- SHA: \`$COMMIT\`"
            echo "- Subject: $(git log -1 --format=%s)"
            echo "- Contained in:"; echo "$branches" | sed 's/^ */  - /'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run worker:build
      - run: bun run test:integration
      - run: bun run test:acceptance
      - run: bun run test:security
      - run: bun audit
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:branding

      - name: Record logo checksum
        run: |
          logo=$(node -e 'const fs=require("fs");const m=JSON.parse(fs.readFileSync("docs/design/AFNAN-BRAND-ASSET.json","utf8"));console.log(m.original.repositoryPath)')
          built=".output/public/${logo#public/}"
          sum=$(sha256sum "$built" | cut -d' ' -f1)
          expected=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("docs/design/AFNAN-BRAND-ASSET.json","utf8")).original.expectedSha256)')
          test "$sum" = "$expected"
          echo "- Built logo \`${built}\` SHA-256 \`$sum\` (matches manifest)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: afnan-output-${{ steps.commit.outputs.sha }}
          path: .output
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to Afnan acceptance Worker
    needs: verify-and-build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: afnan-acceptance
      url: https://afnan-collection-storefront.danwakili.workers.dev
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.verify-and-build.outputs.commit }}
          persist-credentials: false

      - name: Confirm checked-out commit
        env:
          COMMIT: ${{ needs.verify-and-build.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$COMMIT"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: afnan-output-${{ needs.verify-and-build.outputs.commit }}
          path: .output

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Dependencies are needed only so Wrangler can bundle worker.ts; no lifecycle scripts run.
      - run: bun install --frozen-lockfile --ignore-scripts

      - name: Install pinned Wrangler (independent of the commit's lockfile)
        run: npm install --prefix "$RUNNER_TEMP/wrangler" --no-save --ignore-scripts --no-audit --no-fund "wrangler@${WRANGLER_VERSION}"

      - name: Write fixed acceptance configuration
        run: |
          mkdir -p .wrangler/acceptance
          cat > .wrangler/acceptance/wrangler.jsonc <<'EOF'
          {
            "name": "afnan-collection-storefront",
            "account_id": "b4e142fe9da84ef204eecda2efe4a730",
            "main": "../../worker.ts",
            "compatibility_date": "2026-11-13",
            "compatibility_flags": ["nodejs_compat"],
            "workers_dev": true,
            "preview_urls": false,
            "routes": [],
            "assets": { "directory": "../../.output/public", "binding": "ASSETS", "run_worker_first": true },
            "observability": { "enabled": true, "traces": { "enabled": true } },
            "vars": {
              "APP_ENV": "acceptance",
              "APP_ORIGIN": "https://afnan-collection-storefront.danwakili.workers.dev",
              "CHECKOUT_ENABLED": "false",
              "PAYMENT_MODE": "disabled",
              "EMAIL_SENDER_VERIFIED": "false"
            },
            "d1_databases": [{ "binding": "DB", "database_name": "afnan-collection-acceptance", "database_id": "11950c2f-14bb-4a31-9add-356f155dea4e", "migrations_dir": "../../migrations" }],
            "r2_buckets": [{ "binding": "MEDIA", "bucket_name": "afnan-product-media-acceptance" }]
          }
          EOF

      - name: Deploy
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b4e142fe9da84ef204eecda2efe4a730
          WRANGLER_SEND_METRICS: "false"
          COMMIT: ${{ needs.verify-and-build.outputs.commit }}
          REASON: ${{ inputs.reason }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set on the afnan-acceptance environment."
            exit 1
          fi
          msg="acceptance ${COMMIT:0:7}: ${REASON}"
          "$RUNNER_TEMP/wrangler/node_modules/.bin/wrangler" deploy \
            --config .wrangler/acceptance/wrangler.jsonc \
            --message "${msg:0:100}" 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          version=$(grep -oE 'Current Version ID: [0-9a-f-]{36}' "$RUNNER_TEMP/deploy.log" | awk '{print $4}')
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo "### Deployment"
            echo "- Worker: \`afnan-collection-storefront\` (acceptance, Access-protected workers.dev only)"
            echo "- Commit: \`$COMMIT\`"
            echo "- Version: \`$version\`"
            echo "- Reason: $REASON"
            echo "- Rollback: \`wrangler rollback <previous-version-id>\`"
          } >> "$GITHUB_STEP_SUMMARY"
