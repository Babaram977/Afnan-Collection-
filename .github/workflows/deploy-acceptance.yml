name: Deploy Afnan acceptance

# Manual, owner-only deployment of an exact commit to the existing Access-protected
# acceptance Worker. Never triggered by push or pull_request.
#
# Security model:
# - Only the repository owner may dispatch, only from `main` (checked in-workflow and by the
#   `afnan-acceptance` environment's branch policy), and the deploy job waits for the
#   environment's required reviewer.
# - The commit must be a full SHA contained in a branch of THIS repository; commits that exist
#   only on fork pull-request refs are refused.
# - `build` runs the commit's code (install, tests, build, bundling) with NO secrets. It emits a
#   single artifact: the final Worker module and static assets, plus a manifest that records the
#   commit and the SHA-256 of every file.
# - `deploy` is the only job that receives CLOUDFLARE_API_TOKEN. It never checks out the
#   repository and never installs or runs application code: it verifies the artifact against its
#   manifest and the requested commit, then uploads it with a pinned Wrangler using --no-bundle
#   from a directory that contains only the artifact and a config written by this workflow.
# - Target, bindings and variables are fixed here, not read from the commit. This workflow does
#   not touch Cloudflare Access, DNS, routes or any other Worker.

on:
  # Automatic: after "Validate Afnan" succeeds for a push to main of this repository.
  workflow_run:
    workflows: ["Validate Afnan"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: "Full 40-character commit SHA to deploy (must be on a branch of this repository)"
        required: true
        type: string
      reason:
        description: "Why this commit is being deployed (recorded in the run and the Worker version message)"
        required: true
        type: string
      acceptance_checkout:
        description: "Acceptance checkout (bank-transfer orders on the protected acceptance Worker only). Payments stay disabled either way."
        required: true
        type: choice
        options:
          - disabled
          - enabled
        default: disabled
      email_sender:
        description: "Mark the Resend sender as verified (requires RESEND_API_KEY Worker secret). Admin sign-in codes need this."
        required: true
        type: choice
        options:
          - unverified
          - verified
        default: unverified

run-name: "Acceptance deploy ${{ inputs.commit || github.event.workflow_run.head_sha }} (${{ github.event_name == 'workflow_run' && 'automatic' || 'manual' }}) by ${{ github.actor }}"

permissions:
  contents: read

defaults:
  run:
    shell: bash # -eo pipefail

concurrency:
  group: afnan-acceptance-deploy
  cancel-in-progress: false

env:
  # Manual runs use the dispatch inputs. Automatic runs use the repository variables
  # AFNAN_ACCEPTANCE_CHECKOUT / AFNAN_ACCEPTANCE_EMAIL_SENDER (owner-controlled settings), defaulting to
  # checkout disabled and sender verified. Card payments stay pinned disabled either way.
  COMMIT_SHA: ${{ inputs.commit || github.event.workflow_run.head_sha }}
  CHECKOUT_MODE: ${{ inputs.acceptance_checkout || vars.AFNAN_ACCEPTANCE_CHECKOUT || 'disabled' }}
  SENDER_MODE: ${{ inputs.email_sender || vars.AFNAN_ACCEPTANCE_EMAIL_SENDER || 'verified' }}
  DEPLOY_REASON: ${{ inputs.reason || format('automatic after Validate Afnan passed for {0}', github.event.workflow_run.head_sha) }}
  WRANGLER_VERSION: "4.160.0"
  NODE_VERSION: "24"
  BUN_VERSION: "1.4.4"

jobs:
  build:
    name: Verify commit, test and build artifact (no secrets)
    if: >-
      github.ref == 'refs/heads/main' && (
          github.event_name == 'workflow_dispatch' || (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Restrict to repository owner
        env:
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          # Manual dispatch: repository owner only. Automatic runs are gated by the job condition
          # (a successful run for a push to main of this repository).
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$ACTOR" != "$OWNER" ]; then
            echo "::error::Only the repository owner may deploy to Afnan acceptance (actor: $ACTOR)."
            exit 1
          fi

      - name: Validate acceptance_checkout input
        env:
          CHECKOUT: ${{ env.CHECKOUT_MODE }}
        run: |
          case "$CHECKOUT" in
            disabled|enabled) echo "- Acceptance checkout: **$CHECKOUT** (payments stay disabled)" >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "::error::acceptance_checkout must be 'disabled' or 'enabled'."; exit 1 ;;
          esac
          case "${{ env.SENDER_MODE }}" in unverified|verified) ;; *) echo "::error::email_sender must be 'unverified' or 'verified'."; exit 1 ;; esac

      - name: Validate commit input
        id: commit
        env:
          COMMIT: ${{ env.COMMIT_SHA }}
        run: |
          if ! printf '%s' "$COMMIT" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::commit must be a full lowercase 40-character SHA."
            exit 1
          fi
          echo "sha=$COMMIT" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require commit to be on a branch of this repository
        env:
          COMMIT: ${{ steps.commit.outputs.sha }}
        run: |
          git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'
          branches=$(git branch -r --contains "$COMMIT" 2>/dev/null || true)
          if [ -z "$branches" ]; then
            echo "::error::$COMMIT is not contained in any branch of ${GITHUB_REPOSITORY}; refusing."
            exit 1
          fi
          git checkout --detach "$COMMIT"
          test "$(git rev-parse HEAD)" = "$COMMIT"
          {
            echo "### Commit"
            echo "- SHA: \`$COMMIT\`"
            echo "- Subject: $(git log -1 --format=%s)"
            echo "- Contained in:"; echo "$branches" | sed 's/^ */  - /'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run worker:build
      - run: bun run test:integration
      - run: bun run test:acceptance
      - run: bun run test:security
      - run: bun run test:domain
      - run: bun run test:admin-otp
      - run: bun run test:admin-password
      - run: bun audit
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:branding
      - run: bun run test:admin-dashboard
      - run: bun run test:admin-images

      - name: Install pinned Wrangler outside the checkout
        run: |
          mkdir -p "$RUNNER_TEMP/tool" && cd "$RUNNER_TEMP/tool"
          npm install --no-save --ignore-scripts --no-audit --no-fund "wrangler@${WRANGLER_VERSION}"

      - name: Bundle the final Worker module with the fixed acceptance configuration
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          mkdir -p .wrangler/acceptance
          cat > .wrangler/acceptance/wrangler.jsonc <<'EOF'
          {
            "name": "afnan-collection-storefront",
            "account_id": "b4e142fe9da84ef204eecda2efe4a730",
            "main": "../../worker.ts",
            "compatibility_date": "2026-11-13",
            "compatibility_flags": ["nodejs_compat"],
            "workers_dev": true,
            "preview_urls": false,
            "routes": [],
            "assets": { "directory": "../../.output/public", "binding": "ASSETS", "run_worker_first": true },
            "d1_databases": [{ "binding": "DB", "database_name": "afnan-collection-acceptance", "database_id": "11950c2f-14bb-4a31-9add-356f155dea4e" }],
            "r2_buckets": [{ "binding": "MEDIA", "bucket_name": "afnan-product-media-acceptance" }, { "binding": "RECEIPTS", "bucket_name": "afnan-payment-receipts-acceptance" }]
          }
          EOF
          "$RUNNER_TEMP/tool/node_modules/.bin/wrangler" deploy --config .wrangler/acceptance/wrangler.jsonc \
            --dry-run --outdir "$RUNNER_TEMP/bundle"

      - name: Assemble artifact and manifest
        env:
          COMMIT: ${{ steps.commit.outputs.sha }}
        run: |
          A="$RUNNER_TEMP/artifact"
          mkdir -p "$A/bundle" "$A/public"
          # Only a single self-contained module is supported; fail if Wrangler emitted others.
          extra=$(find "$RUNNER_TEMP/bundle" -type f ! -name worker.js ! -name worker.js.map ! -name README.md)
          if [ -n "$extra" ]; then echo "::error::Unexpected bundle outputs: $extra"; exit 1; fi
          cp "$RUNNER_TEMP/bundle/worker.js" "$A/bundle/worker.js"
          cp -R .output/public/. "$A/public/"
          cp -R migrations "$A/migrations"
          logo=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("docs/design/AFNAN-BRAND-ASSET.json","utf8")).original.repositoryPath)')
          expected=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("docs/design/AFNAN-BRAND-ASSET.json","utf8")).original.expectedSha256)')
          sum=$(sha256sum "$A/public/${logo#public/}" | cut -d' ' -f1)
          test "$sum" = "$expected"
          printf '%s\n' "$COMMIT" > "$A/COMMIT"
          (cd "$A" && find . -type f ! -name MANIFEST.sha256 -print0 | sort -z | xargs -0 sha256sum > MANIFEST.sha256)
          {
            echo "### Artifact"
            echo "- Worker module SHA-256: \`$(sha256sum "$A/bundle/worker.js" | cut -d' ' -f1)\`"
            echo "- Files: $(wc -l < "$A/MANIFEST.sha256")"
            echo "- Logo \`${logo#public}\` SHA-256 \`$sum\` (matches brand manifest)"
            echo "- Manifest SHA-256: \`$(sha256sum "$A/MANIFEST.sha256" | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: afnan-acceptance-${{ steps.commit.outputs.sha }}
          path: ${{ runner.temp }}/artifact
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy verified artifact to Afnan acceptance Worker
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: afnan-acceptance
      url: https://afnan-collection-storefront.danwakili.workers.dev
    steps:
      # No checkout and no application dependency install in this job.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: afnan-acceptance-${{ needs.build.outputs.commit }}
          path: ${{ runner.temp }}/work/artifact

      - name: Verify artifact integrity and commit
        working-directory: ${{ runner.temp }}/work/artifact
        env:
          COMMIT: ${{ needs.build.outputs.commit }}
          REQUESTED: ${{ env.COMMIT_SHA }}
        run: |
          test "$COMMIT" = "$REQUESTED"
          test "$(cat COMMIT)" = "$COMMIT"
          sha256sum --quiet -c MANIFEST.sha256
          listed=$(cut -c67- MANIFEST.sha256 | sort)
          present=$(find . -type f ! -name MANIFEST.sha256 | sort)
          test "$listed" = "$present"
          echo "- Artifact verified for \`$COMMIT\` ($(wc -l < MANIFEST.sha256) files)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pinned Wrangler (no application code involved)
        run: |
          mkdir -p "$RUNNER_TEMP/tool" && cd "$RUNNER_TEMP/tool"
          npm install --no-save --ignore-scripts --no-audit --no-fund "wrangler@${WRANGLER_VERSION}"

      - name: Write fixed acceptance configuration
        working-directory: ${{ runner.temp }}/work
        env:
          CHECKOUT: ${{ env.CHECKOUT_MODE }}
          SENDER: ${{ env.SENDER_MODE }}
        run: |
          cat > wrangler.jsonc <<'EOF'
          {
            "name": "afnan-collection-storefront",
            "account_id": "b4e142fe9da84ef204eecda2efe4a730",
            "main": "artifact/bundle/worker.js",
            "no_bundle": true,
            "compatibility_date": "2026-11-13",
            "compatibility_flags": ["nodejs_compat"],
            "workers_dev": true,
            "preview_urls": false,
            "routes": [],
            "assets": { "directory": "artifact/public", "binding": "ASSETS", "run_worker_first": true },
            "observability": { "enabled": true, "traces": { "enabled": true } },
            "vars": {
              "APP_ENV": "acceptance",
              "APP_ORIGIN": "https://afnan-collection-storefront.danwakili.workers.dev",
              "CHECKOUT_ENABLED": "false",
              "PAYMENT_MODE": "disabled",
              "EMAIL_FROM": "noreply@afnancollectionkn.com",
              "ADMIN_AUTH_MODE": "password",
              "EMAIL_SENDER_VERIFIED": "false"
            },
            "d1_databases": [{ "binding": "DB", "database_name": "afnan-collection-acceptance", "database_id": "11950c2f-14bb-4a31-9add-356f155dea4e", "migrations_dir": "artifact/migrations" }],
            "r2_buckets": [{ "binding": "MEDIA", "bucket_name": "afnan-product-media-acceptance" }, { "binding": "RECEIPTS", "bucket_name": "afnan-payment-receipts-acceptance" }]
          }
          EOF
          # The only variable an operator may choose. Strict mapping; PAYMENT_MODE stays pinned.
          case "$CHECKOUT" in
            enabled) value=true ;;
            disabled) value=false ;;
            *) echo "::error::acceptance_checkout must be 'disabled' or 'enabled'."; exit 1 ;;
          esac
          case "$SENDER" in verified) sv=true ;; unverified) sv=false ;; *) exit 1 ;; esac
          node -e 'const fs=require("fs");const c=JSON.parse(fs.readFileSync("wrangler.jsonc","utf8"));c.vars.CHECKOUT_ENABLED=process.argv[1];c.vars.EMAIL_SENDER_VERIFIED=process.argv[2];if(c.vars.PAYMENT_MODE!=="disabled")process.exit(2);fs.writeFileSync("wrangler.jsonc",JSON.stringify(c,null,2));console.log("CHECKOUT_ENABLED="+c.vars.CHECKOUT_ENABLED,"EMAIL_SENDER_VERIFIED="+c.vars.EMAIL_SENDER_VERIFIED,"PAYMENT_MODE="+c.vars.PAYMENT_MODE)' "$value" "$sv"
          ls -A

      - name: Refuse to deploy while database migrations are pending
        # Migrations are never applied by this workflow; they stay a separately approved step.
        working-directory: ${{ runner.temp }}/work
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b4e142fe9da84ef204eecda2efe4a730
          WRANGLER_SEND_METRICS: "false"
        run: |
          out=$("$RUNNER_TEMP/tool/node_modules/.bin/wrangler" d1 migrations list DB --remote --config wrangler.jsonc 2>&1) || { echo "$out"; exit 1; }
          if ! printf '%s' "$out" | grep -q "No migrations to apply"; then
            echo "$out"
            echo "::error::This commit has database migrations that are not applied to the target D1. Apply them under a separate approval first."
            exit 1
          fi
          echo "- D1 migrations: none pending" >> "$GITHUB_STEP_SUMMARY"

      - name: Record the live version for rollback
        working-directory: ${{ runner.temp }}/work
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b4e142fe9da84ef204eecda2efe4a730
          WRANGLER_SEND_METRICS: "false"
        run: |
          prev=$("$RUNNER_TEMP/tool/node_modules/.bin/wrangler" deployments status --config wrangler.jsonc 2>&1 | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1 || true)
          echo "- Version live before this deploy (rollback target): \`${prev:-none (first deployment)}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy
        working-directory: ${{ runner.temp }}/work
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b4e142fe9da84ef204eecda2efe4a730
          WRANGLER_SEND_METRICS: "false"
          COMMIT: ${{ needs.build.outputs.commit }}
          REASON: ${{ env.DEPLOY_REASON }}
          CHECKOUT: ${{ env.CHECKOUT_MODE }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set on the afnan-acceptance environment."
            exit 1
          fi
          msg="acceptance ${COMMIT:0:7} checkout=${CHECKOUT}: ${REASON}"
          "$RUNNER_TEMP/tool/node_modules/.bin/wrangler" deploy --config wrangler.jsonc \
            --message "${msg:0:100}" 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          version=$(grep -oE 'Current Version ID: [0-9a-f-]{36}' "$RUNNER_TEMP/deploy.log" | awk '{print $4}')
          test -n "$version"
          {
            echo "### Deployment"
            echo "- Worker: \`afnan-collection-storefront\` (acceptance, Access-protected workers.dev only)"
            echo "- Commit: \`$COMMIT\`"
            echo "- Version: \`$version\`"
            echo "- Acceptance checkout: $CHECKOUT ($(grep -o '"CHECKOUT_ENABLED": "[a-z]*"' wrangler.jsonc)); payments: disabled"
            echo "- Reason: $REASON"
            echo "- Rollback: \`wrangler rollback <previous-version-id>\`"
          } >> "$GITHUB_STEP_SUMMARY"
