name: Validate Afnan
on:
  pull_request:
  push:
    branches: [main, feat/commerce-platform]
permissions:
  contents: read
concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    # Allow required browser installation to finish; two earlier 20-minute jobs timed out.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run worker:build
      - name: Apply and replay local migrations
        run: |
          bun run db:migrate:local
          bun run db:migrate:local
      - run: bun run test:integration
      - run: bun run test:acceptance
      - run: bun run test:security
      - run: bun run test:domain
      - run: bun run test:admin-otp
      - run: bun run test:admin-password
      - run: bun run test:single-admin-login
      # bun audit with narrow, expiring, owner-approved exceptions (security/audit-exceptions.json).
      # Fails on any other advisory, an expired or stale exception, a published patch, or excepted
      # package code in the built Worker/browser assets.
      - run: bun run security:audit
      - run: bunx playwright install --with-deps chromium webkit
      - run: bun run test:mobile-header
      - name: Mobile header in WebKit
        run: bun run test:mobile-header
        env:
          HEADER_BROWSER: webkit
          HEADER_REVIEW_DIR: /tmp/afnan-header-review/webkit
      # Includes browser checks of the bank-transfer confirmation, so it runs after the browser install.
      - run: bun run test:bank-transfer
      - run: bun run test:order-selections
      - run: bun run test:receipts
      - run: bun run test:browser
      - run: bun run test:branding
      - run: bun run test:storefront
      - run: bun run test:admin-dashboard
      - run: bun run test:single-admin-login-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: single-admin-login-review
          path: /tmp/afnan-single-login
          retention-days: 14
      - run: bun run test:account-retirement
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: account-retirement-review
          path: /tmp/afnan-account-retirement
          retention-days: 14
      - run: bun run test:admin-navigation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-navigation-review
          path: /tmp/afnan-admin-navigation
          retention-days: 14
      - run: bun run test:admin-overview
      - run: bun run test:admin-images
      - run: bun run test:image-performance
      - run: bun run test:admin-editor
      - run: bun run test:cart-flow
      - run: bun run test:shopping
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-header-review
          path: /tmp/afnan-header-review
          retention-days: 14
