name: Migrate Afnan acceptance 0007 and 0008

# Owner-dispatched and ACCEPTANCE-only (owner approval 2026-11-22: prepare the acceptance release of
# PR #43). Applies the pending migrations 0007_fulfilment_options.sql and then
# 0008_order_tracking_notifications.sql, in that order, through Wrangler's D1 ledger, to the
# acceptance D1 `afnan-collection-acceptance` only. It deploys no Worker and changes no environment,
# credential, Access policy, DNS, checkout or payment setting. It never touches production: the
# database id, name and Worker name below are acceptance's, and identity is verified before any change.
#
# Safeguards (same model as migrate-acceptance-0006.yml and migrate-production-0007.yml):
# - owner dispatch from main; `afnan-acceptance` environment must forbid admin bypass and allow only
#   main; exact-release CI must have passed for the pinned release;
# - only migrations/ at the pinned release is packaged, with 0006/0007/0008 checksums pinned; the job
#   that holds the Cloudflare token runs no application code;
# - D1 identity (UUID and name) confirmed; a Time Travel recovery bookmark captured first;
# - the ledger must be one of three states: 0001-0006 (apply 0007+0008), 0001-0007 (an earlier run
#   stopped after 0007: apply 0008 only) or 0001-0008 (nothing to do). Every migration's schema
#   objects must agree with the ledger; any partial or manual change stops the run;
# - before 0008, existing bank references must be unique (its unique index would otherwise fail);
# - integrity and foreign keys checked before and after; users, staff, sessions, accounts, catalogue,
#   stock, orders, order lines, receipts, approvals, zones, categories, banners and history unchanged;
#   the three internal zones added inactive and free; existing orders default to delivery; the new
#   inbox and outbox start empty (no backfill).
on:
  workflow_dispatch:
    inputs:
      approval_reference:
        description: Owner approval reference for acceptance migrations 0007 and 0008
        required: true
        type: string

permissions:
  contents: read
  actions: read
  deployments: read

# Serialize with the acceptance deploy workflow; never migrate during a deploy.
concurrency:
  group: afnan-acceptance-deploy
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  RELEASE: a29ddcfae41603caa70e77d8999264997ee591a1
  RELEASE_CI_RUN: "45077162618"
  ACCOUNT: b4e142fe9da84ef204eecda2efe4a730
  DATABASE: 11950c2f-14bb-4a31-9add-356f155dea4e

jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require owner dispatch, protected environment and passing exact-release CI
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVAL: ${{ inputs.approval_reference }}
        run: |
          test -n "$APPROVAL"
          gh api "repos/$GITHUB_REPOSITORY/environments/afnan-acceptance" > "$RUNNER_TEMP/environment.json"
          gh api "repos/$GITHUB_REPOSITORY/environments/afnan-acceptance/deployment-branch-policies" > "$RUNNER_TEMP/branches.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_CI_RUN" > "$RUNNER_TEMP/ci.json"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const read = name => JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/${name}.json`, 'utf8'));
          const e = read('environment');
          assert.equal(e.name.toLowerCase(), 'afnan-acceptance');
          assert.equal(e.can_admins_bypass, false, 'Environment must prohibit administrator bypass');
          assert.equal(e.deployment_branch_policy.custom_branch_policies, true);
          assert.equal(e.deployment_branch_policy.protected_branches, false);
          const branches = read('branches').branch_policies;
          assert.equal(branches.length, 1);
          assert.equal(branches[0].name, 'main');
          assert.equal(branches[0].type, 'branch');
          const ci = read('ci');
          assert.equal(ci.name, 'Validate Afnan');
          assert.equal(ci.head_sha, process.env.RELEASE);
          assert.equal(ci.head_branch, 'main');
          assert.equal(ci.event, 'push');
          assert.equal(ci.conclusion, 'success');
          JS

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: a29ddcfae41603caa70e77d8999264997ee591a1
          persist-credentials: false
          sparse-checkout: migrations

      - name: Package only the approved migration sequence (no application execution)
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE"
          test "$(find migrations -type f | wc -l)" = 8
          sha256sum -c - <<'SUMS'
          7369cf4f682bb1e485fc29fa1b9f4dbd9699da035d55de0e9b656a78c08cb26f  migrations/0006_session_authentication_method.sql
          9ca0074838f8ccffd089acb3c1b013ce0004148db5fe16bee3418393013affc7  migrations/0007_fulfilment_options.sql
          9ddc292ab66b73d30b2d488c3fc7f56edbeca22aa44b67fed92716a7589fbd9a  migrations/0008_order_tracking_notifications.sql
          SUMS
          mkdir -p "$RUNNER_TEMP/migration-artifact"
          cp -R migrations "$RUNNER_TEMP/migration-artifact/"
          cd "$RUNNER_TEMP/migration-artifact"
          sha256sum migrations/*.sql > MANIFEST.sha256

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: approved-acceptance-migrations-0007-0008
          path: ${{ runner.temp }}/migration-artifact
          retention-days: 1
          if-no-files-found: error

  migrate:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: afnan-acceptance
    steps:
      # No checkout, application dependencies or application scripts in this job.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: approved-acceptance-migrations-0007-0008
          path: ${{ runner.temp }}/migration-work
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install pinned operator tooling without application code
        run: |
          mkdir -p "$RUNNER_TEMP/operator"
          cd "$RUNNER_TEMP/operator"
          npm install --no-save --ignore-scripts --no-audit --no-fund wrangler@4.160.0

      - name: Verify identity and recovery, then apply 0007 and 0008 through the Wrangler ledger once
        working-directory: ${{ runner.temp }}/migration-work
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b4e142fe9da84ef204eecda2efe4a730
          WRANGLER_SEND_METRICS: 'false'
          APPROVAL: ${{ inputs.approval_reference }}
        run: |
          umask 077
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Existing afnan-acceptance CLOUDFLARE_API_TOKEN is unavailable; configure it securely in GitHub, never chat.'; exit 1; }
          sha256sum --quiet -c MANIFEST.sha256
          sha256sum -c - <<'SUMS'
          9ca0074838f8ccffd089acb3c1b013ce0004148db5fe16bee3418393013affc7  migrations/0007_fulfilment_options.sql
          9ddc292ab66b73d30b2d488c3fc7f56edbeca22aa44b67fed92716a7589fbd9a  migrations/0008_order_tracking_notifications.sql
          SUMS
          cat > wrangler.jsonc <<'JSON'
          {"name":"afnan-collection-storefront","account_id":"b4e142fe9da84ef204eecda2efe4a730","d1_databases":[{"binding":"DB","database_name":"afnan-collection-acceptance","database_id":"11950c2f-14bb-4a31-9add-356f155dea4e","migrations_dir":"migrations"}]}
          JSON
          W="$RUNNER_TEMP/operator/node_modules/.bin/wrangler"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${process.env.ACCOUNT}/d1/database/${process.env.DATABASE}`, {
            headers: { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` }
          });
          assert(response.ok, `D1 identity read failed: HTTP ${response.status}; check existing token's D1 permission on the fixed account`);
          const body = await response.json(); assert.equal(body.success, true);
          assert.equal(body.result.uuid, process.env.DATABASE);
          assert.equal(body.result.name, 'afnan-collection-acceptance');
          assert.notEqual(body.result.uuid, '73ddfc46-34ba-4733-841d-e4819af0b957', 'Never the production database');
          JS
          "$W" d1 time-travel info DB --config wrangler.jsonc --json > recovery.json
          "$W" d1 migrations list DB --config wrangler.jsonc --remote > pending-before.txt
          # Schema, integrity, aggregates and order/line/stock amounts only. No customer contact
          # details, addresses, tokens, password hashes or account rows are selected; nothing read here
          # is uploaded, and the work directory is deleted at the end.
          SQL="SELECT name FROM d1_migrations ORDER BY id; PRAGMA table_info(orders); PRAGMA table_info(order_items); PRAGMA table_info(payment_receipts); SELECT name,type FROM sqlite_master WHERE name IN ('admin_events','email_outbox','bank_transfer_approvals_reference_idx','payment_receipts_transfer_reference_idx') ORDER BY name; PRAGMA quick_check; SELECT COUNT(*) AS violations FROM pragma_foreign_key_check; SELECT (SELECT COUNT(*) FROM user) AS users,(SELECT COUNT(*) FROM staff) AS staff,(SELECT COUNT(*) FROM account) AS accounts,(SELECT COUNT(*) FROM products) AS products,(SELECT COUNT(*) FROM variants) AS variants,(SELECT COALESCE(SUM(stock),0) FROM variants) AS units,(SELECT COUNT(*) FROM orders) AS orders,(SELECT COUNT(*) FROM order_items) AS order_items,(SELECT COUNT(*) FROM payment_receipts) AS receipts,(SELECT COUNT(*) FROM bank_transfer_approvals) AS approvals,(SELECT COUNT(*) FROM categories) AS categories,(SELECT COUNT(*) FROM banners) AS banners,(SELECT COUNT(*) FROM inventory_movements) AS inventory_history,(SELECT COUNT(*) FROM audit) AS audit; SELECT id FROM session ORDER BY id; SELECT id,status,zone_id,delivery_kobo,total_kobo,payment_method,expires_at FROM orders ORDER BY id; SELECT order_id,variant_id,price_kobo,qty FROM order_items ORDER BY order_id,variant_id; SELECT id,stock,price_kobo,sale_price_kobo FROM variants ORDER BY id; SELECT id,name,state,fee_kobo,active FROM zones ORDER BY id; SELECT COUNT(*) AS duplicate_bank_references FROM (SELECT upper(trim(bank_reference)) r FROM bank_transfer_approvals GROUP BY r HAVING COUNT(*)>1);"
          "$W" d1 execute DB --config wrangler.jsonc --remote --json --command "$SQL" > before.json
          node --input-type=module <<'JS'
          import fs from 'node:fs'; import assert from 'node:assert/strict';
          const rows = JSON.parse(fs.readFileSync('before.json', 'utf8'));
          assert(rows.every(r => r.success === true));
          const base = ['0001_commerce.sql','0002_admin_management.sql','0003_administrator_mfa.sql','0004_bank_transfer_reservation.sql','0005_payment_receipts.sql','0006_session_authentication_method.sql'];
          const m7 = '0007_fulfilment_options.sql', m8 = '0008_order_tracking_notifications.sql';
          const ledger = rows[0].results.map(r => r.name);
          const states = { none: base, only7: [...base, m7], both: [...base, m7, m8] };
          const state = Object.keys(states).find(k => JSON.stringify(states[k]) === JSON.stringify(ledger));
          assert(state, `Unexpected ledger ${JSON.stringify(ledger)}; stop`);
          const col = (i, name) => rows[i].results.some(c => c.name === name);
          const objects = rows[4].results.map(o => o.name);
          const has7 = [col(1, 'fulfilment_method'), col(1, 'carrier_paid_direct'), col(2, 'selections')];
          const has8 = [col(3, 'transfer_reference'), ...['admin_events','email_outbox','bank_transfer_approvals_reference_idx','payment_receipts_transfer_reference_idx'].map(n => objects.includes(n))];
          const applied7 = state !== 'none', applied8 = state === 'both';
          assert(has7.every(x => x === applied7), `0007 schema ${JSON.stringify(has7)} disagrees with ledger (${state}); stop on partial/manual migration`);
          assert(has8.every(x => x === applied8), `0008 schema ${JSON.stringify(has8)} disagrees with ledger (${state}); stop on partial/manual migration`);
          assert.equal(rows[5].results[0].quick_check, 'ok');
          assert.equal(rows[6].results[0].violations, 0);
          const pending = fs.readFileSync('pending-before.txt', 'utf8');
          for (const name of base) assert(!pending.includes(name), 'Earlier migration unexpectedly pending');
          if (state === 'both') assert(pending.includes('No migrations to apply'));
          if (state === 'only7') { assert(pending.includes(m8)); assert(!pending.includes(m7)); }
          if (state === 'none') { assert(pending.includes(m7)); assert(pending.includes(m8)); }
          const internal = ['c3b0d60b-bbc3-4542-958a-f81b5f6e50fd','3c28076b-0e9f-4c76-97c5-e52d07aa2b8e','4dce8f67-efc6-472d-89ce-66396973e985'];
          if (state === 'none') assert.equal(rows[12].results.filter(z => internal.includes(z.id)).length, 0, 'Internal zone ids already exist before 0007');
          if (!applied8) assert.equal(rows[13].results[0].duplicate_bank_references, 0, 'Duplicate bank references would break the 0008 unique index; resolve first');
          const recovery = JSON.parse(fs.readFileSync('recovery.json', 'utf8'));
          assert.equal(typeof recovery.bookmark, 'string'); assert(recovery.bookmark.length > 0);
          const a = rows[7].results[0];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### Acceptance migrations 0007 + 0008\n- Release: ${process.env.RELEASE}\n- D1: ${process.env.DATABASE} (afnan-collection-acceptance, identity verified)\n- Pre-action Time Travel bookmark: ${recovery.bookmark}\n- Starting state: ${state}; integrity ok; FK violations 0.\n- Before: users ${a.users}, staff ${a.staff}, products ${a.products}, units ${a.units}, orders ${a.orders}, order lines ${a.order_items}, receipts ${a.receipts}, approvals ${a.approvals}, categories ${a.categories}, audit ${a.audit}.\n`);
          fs.writeFileSync('start-state', state);
          JS
          if [ "$(cat start-state)" != both ]; then
            "$W" d1 migrations apply DB --config wrangler.jsonc --remote
          else
            echo 'Migrations 0007 and 0008 already recorded; nothing repeated.'
          fi
          "$W" d1 migrations list DB --config wrangler.jsonc --remote > pending-after.txt
          grep -q 'No migrations to apply' pending-after.txt
          "$W" d1 execute DB --config wrangler.jsonc --remote --json --command "$SQL SELECT COUNT(*) AS changed FROM orders WHERE fulfilment_method<>'delivery' OR carrier_paid_direct<>0; SELECT COUNT(*) AS with_selections FROM order_items WHERE selections IS NOT NULL; SELECT (SELECT COUNT(*) FROM admin_events) AS events,(SELECT COUNT(*) FROM email_outbox) AS outbox,(SELECT COUNT(*) FROM payment_receipts WHERE transfer_reference IS NOT NULL) AS references_set; SELECT name,\"unique\" FROM pragma_index_list('bank_transfer_approvals') WHERE name='bank_transfer_approvals_reference_idx';" > after.json
          node --input-type=module <<'JS'
          import fs from 'node:fs'; import assert from 'node:assert/strict';
          const read = n => JSON.parse(fs.readFileSync(n, 'utf8'));
          const b = read('before.json'), a = read('after.json');
          const state = fs.readFileSync('start-state', 'utf8');
          assert(a.every(r => r.success === true));
          assert.deepEqual(a[0].results.map(r => r.name), ['0001_commerce.sql','0002_admin_management.sql','0003_administrator_mfa.sql','0004_bank_transfer_reservation.sql','0005_payment_receipts.sql','0006_session_authentication_method.sql','0007_fulfilment_options.sql','0008_order_tracking_notifications.sql']);
          const col = (i, name) => a[i].results.find(c => c.name === name);
          const fm = col(1, 'fulfilment_method'), cp = col(1, 'carrier_paid_direct'), sel = col(2, 'selections'), ref = col(3, 'transfer_reference');
          assert(fm && cp && sel && ref, 'New columns present');
          assert.equal(fm.type, 'TEXT'); assert.equal(fm.notnull, 1); assert.equal(fm.dflt_value, "'delivery'");
          assert.equal(cp.type, 'INTEGER'); assert.equal(cp.notnull, 1); assert.equal(cp.dflt_value, '0');
          assert.equal(sel.type, 'TEXT'); assert.equal(sel.notnull, 0); assert.equal(sel.dflt_value, null);
          assert.equal(ref.type, 'TEXT'); assert.equal(ref.notnull, 0); assert.equal(ref.dflt_value, null);
          assert.deepEqual(a[4].results.map(o => o.name), ['admin_events','bank_transfer_approvals_reference_idx','email_outbox','payment_receipts_transfer_reference_idx']);
          assert.equal(a[17].results.length, 1); assert.equal(a[17].results[0].unique, 1, 'Bank reference index is unique');
          assert.equal(a[5].results[0].quick_check, 'ok'); assert.equal(a[6].results[0].violations, 0);
          assert.deepEqual(a[7].results, b[7].results, 'Accounts, staff, catalogue, stock, orders, receipts, approvals, categories, banners and history unchanged');
          assert.deepEqual(a[8].results, b[8].results, 'Existing sessions unchanged');
          assert.deepEqual(a[9].results, b[9].results, 'Existing orders unchanged');
          assert.deepEqual(a[10].results, b[10].results, 'Existing order lines unchanged');
          assert.deepEqual(a[11].results, b[11].results, 'Variant stock and prices unchanged');
          const internal = ['c3b0d60b-bbc3-4542-958a-f81b5f6e50fd','3c28076b-0e9f-4c76-97c5-e52d07aa2b8e','4dce8f67-efc6-472d-89ce-66396973e985'];
          assert.deepEqual(a[12].results.filter(z => !internal.includes(z.id)), b[12].results.filter(z => !internal.includes(z.id)), 'Existing delivery zones unchanged');
          const added = a[12].results.filter(z => internal.includes(z.id));
          assert.equal(added.length, 3); assert(added.every(z => z.active === 0 && z.fee_kobo === 0), 'Internal zones inactive and free');
          if (state === 'none') { assert.equal(a[14].results[0].changed, 0); assert.equal(a[15].results[0].with_selections, 0); }
          if (state !== 'both') assert.deepEqual(a[16].results[0], { events: 0, outbox: 0, references_set: 0 }, 'No backfill into the new inbox/outbox/reference');
          const s = a[7].results[0];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `- After: ledger 0001-0008, no migrations pending. New columns, inbox/outbox tables and the unique bank-reference index present.\n- Integrity ok; FK violations 0. Unchanged: users ${s.users}, staff ${s.staff}, sessions, ${s.products} products, ${s.units} units, ${s.orders} orders, ${s.order_items} order lines, ${s.receipts} receipts, ${s.approvals} approvals, ${s.categories} categories, zones; 3 internal zones added inactive.\n- No Worker, checkout, payment, Access, DNS, secret or production change.\n`);
          JS
      - name: Remove ephemeral metadata (never upload database evidence)
        if: always()
        run: rm -rf "$RUNNER_TEMP/migration-work"
