name: Deploy Afnan production

# Manual, owner-only deployment of an exact commit to the PRODUCTION Worker
# `afnan-collection-production`, which has its own D1 and R2. Never triggered by push or PR.
# Release gate (owner decision 2026-11-17): automatic runs after acceptance are skipped unless the
# repository variable AFNAN_PRODUCTION_AUTO_DEPLOY is 'enabled'. Owner-approved releases are deployed
# with a manual run (workflow_dispatch, repository owner only) naming the exact validated commit.
# workers.dev is off. The only hostnames are the owner-approved custom domains (2026-11-16):
# afnancollectionkn.com (primary storefront) and www.afnancollectionkn.com (redirects to it, in
# worker.ts). The deploy step refuses any other route.
#
# Security model:
# - Only the repository owner may dispatch, only from `main` (checked in-workflow and by the
#   `afnan-production` environment's branch policy), and the deploy job waits for the
#   environment's required reviewer.
# - The commit must be a full SHA contained in a branch of THIS repository; commits that exist
#   only on fork pull-request refs are refused.
# - `build` runs the commit's code (install, tests, build, bundling) with NO secrets. It emits a
#   single artifact: the final Worker module and static assets, plus a manifest that records the
#   commit and the SHA-256 of every file.
# - `deploy` is the only job that receives CLOUDFLARE_API_TOKEN. It never checks out the
#   repository and never installs or runs application code: it verifies the artifact against its
#   manifest and the requested commit, then uploads it with a pinned Wrangler using --no-bundle
#   from a directory that contains only the artifact and a config written by this workflow.
# - Target, bindings, variables and the two approved custom domains are fixed here, not read from
#   the commit. Wrangler creates the custom domains' DNS records; this workflow does not touch
#   Cloudflare Access, other DNS records, other routes or any other Worker.

on:
  # Automatic: after "Deploy Afnan acceptance" succeeds for a push to main of this repository.
  workflow_run:
    workflows: ["Deploy Afnan acceptance"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: "Full 40-character commit SHA to deploy (must be on a branch of this repository)"
        required: true
        type: string
      reason:
        description: "Why this commit is being deployed (recorded in the run and the Worker version message)"
        required: true
        type: string
      checkout:
        description: "Bank-transfer checkout. Enable only with owner launch authorization. Card payments stay disabled either way."
        required: true
        type: choice
        options:
          - disabled
          - enabled
        default: disabled
      email_sender:
        description: "Mark the Resend sender as verified (requires RESEND_API_KEY Worker secret). Admin sign-in codes need this."
        required: true
        type: choice
        options:
          - unverified
          - verified
        default: unverified

run-name: "PRODUCTION deploy ${{ inputs.commit || github.event.workflow_run.display_title }} (${{ github.event_name == 'workflow_run' && 'automatic' || 'manual' }}) by ${{ github.actor }}"

permissions:
  contents: read

defaults:
  run:
    shell: bash # -eo pipefail

concurrency:
  group: afnan-production-deploy
  cancel-in-progress: false

env:
  # Manual runs use the dispatch inputs. Automatic runs use the repository variables
  # AFNAN_PRODUCTION_CHECKOUT / AFNAN_PRODUCTION_EMAIL_SENDER (owner-controlled settings), defaulting to
  # checkout disabled and sender unverified. Card payments stay pinned disabled either way.
  # Automatic runs: the exact commit is taken from the acceptance run's name ("Acceptance deploy <sha> ..."),
  # not from head_sha, which GitHub sets to main's latest commit when the run was triggered.
  COMMIT_SHA: ${{ inputs.commit }}
  CHECKOUT_MODE: ${{ inputs.checkout || vars.AFNAN_PRODUCTION_CHECKOUT || 'disabled' }}
  SENDER_MODE: ${{ inputs.email_sender || vars.AFNAN_PRODUCTION_EMAIL_SENDER || 'unverified' }}
  DEPLOY_REASON: ${{ inputs.reason || format('automatic after {0}', github.event.workflow_run.display_title) }}
  WRANGLER_VERSION: "4.160.0"
  NODE_VERSION: "24"
  BUN_VERSION: "1.4.4"

jobs:
  build:
    name: Verify commit, test and build artifact (no secrets)
    if: >-
      github.ref == 'refs/heads/main' && (
          github.event_name == 'workflow_dispatch' || (
          vars.AFNAN_PRODUCTION_AUTO_DEPLOY == 'enabled' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'workflow_run' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Restrict to repository owner
        env:
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          # Manual dispatch: repository owner only. Automatic runs are gated by the job condition
          # (a successful run for a push to main of this repository).
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$ACTOR" != "$OWNER" ]; then
            echo "::error::Only the repository owner may deploy to Afnan production (actor: $ACTOR)."
            exit 1
          fi

      - name: Validate inputs
        env:
          CHECKOUT: ${{ env.CHECKOUT_MODE }}
          SENDER: ${{ env.SENDER_MODE }}
        run: |
          case "$CHECKOUT" in disabled|enabled) ;; *) echo "::error::checkout must be 'disabled' or 'enabled'."; exit 1 ;; esac
          case "$SENDER" in unverified|verified) ;; *) echo "::error::email_sender must be 'unverified' or 'verified'."; exit 1 ;; esac
          echo "- Checkout: **$CHECKOUT**; sender: **$SENDER**; card payments: disabled" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate commit input
        id: commit
        env:
          COMMIT: ${{ env.COMMIT_SHA }}
          UPSTREAM_TITLE: ${{ github.event.workflow_run.display_title }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            COMMIT=$(printf '%s' "$UPSTREAM_TITLE" | sed -nE 's/^Acceptance deploy ([0-9a-f]{40}) .*/\1/p')
            echo "- Commit deployed by the triggering acceptance run: \`${COMMIT:-unparseable}\`" >> "$GITHUB_STEP_SUMMARY"
          fi
          if ! printf '%s' "$COMMIT" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::commit must be a full lowercase 40-character SHA."
            exit 1
          fi
          echo "sha=$COMMIT" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require commit to be on a branch of this repository
        env:
          COMMIT: ${{ steps.commit.outputs.sha }}
        run: |
          git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'
          branches=$(git branch -r --contains "$COMMIT" 2>/dev/null || true)
          if [ -z "$branches" ]; then
            echo "::error::$COMMIT is not contained in any branch of ${GITHUB_REPOSITORY}; refusing."
            exit 1
          fi
          # Production deploys only commits that are on main (reached through a validated PR merge).
          if ! git merge-base --is-ancestor "$COMMIT" origin/main; then
            echo "::error::$COMMIT is not on main; production deploys only commits merged to main."
            exit 1
          fi
          git checkout --detach "$COMMIT"
          test "$(git rev-parse HEAD)" = "$COMMIT"
          {
            echo "### Commit"
            echo "- SHA: \`$COMMIT\`"
            echo "- Subject: $(git log -1 --format=%s)"
            echo "- Contained in:"; echo "$branches" | sed 's/^ */  - /'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run worker:build
      - run: bun run test:integration
      - run: bun run test:acceptance
      - run: bun run test:security
      - run: bun run test:domain
      - run: bun run test:admin-otp
      - run: bun run test:admin-password
      - run: bun audit
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:branding
      - run: bun run test:admin-dashboard
      - run: bun run test:admin-images
      - run: bun run test:cart-flow
      - run: bun run test:storefront
      - run: bun run test:bank-transfer
      - run: bun run test:receipts

      - name: Install pinned Wrangler outside the checkout
        run: |
          mkdir -p "$RUNNER_TEMP/tool" && cd "$RUNNER_TEMP/tool"
          npm install --no-save --ignore-scripts --no-audit --no-fund "wrangler@${WRANGLER_VERSION}"

      - name: Bundle the final Worker module with the fixed production configuration
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          mkdir -p .wrangler/production
          cat > .wrangler/production/wrangler.jsonc <<'EOF'
          {
            "name": "afnan-collection-production",
            "account_id": "b4e142fe9da84ef204eecda2efe4a730",
            "main": "../../worker.ts",
            "compatibility_date": "2026-11-13",
            "compatibility_flags": ["nodejs_compat"],
            "workers_dev": false,
            "preview_urls": false,
            "routes": [{ "pattern": "afnancollectionkn.com", "custom_domain": true }, { "pattern": "www.afnancollectionkn.com", "custom_domain": true }],
            "assets": { "directory": "../../.output/public", "binding": "ASSETS", "run_worker_first": true },
            "d1_databases": [{ "binding": "DB", "database_name": "afnan-collection-production", "database_id": "73ddfc46-34ba-4733-841d-e4819af0b957" }],
            "r2_buckets": [{ "binding": "MEDIA", "bucket_name": "afnan-product-media-production" }, { "binding": "RECEIPTS", "bucket_name": "afnan-payment-receipts-production" }]
          }
          EOF
          "$RUNNER_TEMP/tool/node_modules/.bin/wrangler" deploy --config .wrangler/production/wrangler.jsonc \
            --dry-run --outdir "$RUNNER_TEMP/bundle"

      - name: Assemble artifact and manifest
        env:
          COMMIT: ${{ steps.commit.outputs.sha }}
        run: |
          A="$RUNNER_TEMP/artifact"
          mkdir -p "$A/bundle" "$A/public"
          # Only a single self-contained module is supported; fail if Wrangler emitted others.
          extra=$(find "$RUNNER_TEMP/bundle" -type f ! -name worker.js ! -name worker.js.map ! -name README.md)
          if [ -n "$extra" ]; then echo "::error::Unexpected bundle outputs: $extra"; exit 1; fi
          cp "$RUNNER_TEMP/bundle/worker.js" "$A/bundle/worker.js"
          cp -R .output/public/. "$A/public/"
          cp -R migrations "$A/migrations"
          logo=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("docs/design/AFNAN-BRAND-ASSET.json","utf8")).original.repositoryPath)')
          expected=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("docs/design/AFNAN-BRAND-ASSET.json","utf8")).original.expectedSha256)')
          sum=$(sha256sum "$A/public/${logo#public/}" | cut -d' ' -f1)
          test "$sum" = "$expected"
          printf '%s\n' "$COMMIT" > "$A/COMMIT"
          (cd "$A" && find . -type f ! -name MANIFEST.sha256 -print0 | sort -z | xargs -0 sha256sum > MANIFEST.sha256)
          {
            echo "### Artifact"
            echo "- Worker module SHA-256: \`$(sha256sum "$A/bundle/worker.js" | cut -d' ' -f1)\`"
            echo "- Files: $(wc -l < "$A/MANIFEST.sha256")"
            echo "- Logo \`${logo#public}\` SHA-256 \`$sum\` (matches brand manifest)"
            echo "- Manifest SHA-256: \`$(sha256sum "$A/MANIFEST.sha256" | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: afnan-production-${{ steps.commit.outputs.sha }}
          path: ${{ runner.temp }}/artifact
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy verified artifact to Afnan PRODUCTION Worker
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: afnan-production
      url: https://afnancollectionkn.com
    steps:
      # No checkout and no application dependency install in this job.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: afnan-production-${{ needs.build.outputs.commit }}
          path: ${{ runner.temp }}/work/artifact

      - name: Verify artifact integrity and commit
        working-directory: ${{ runner.temp }}/work/artifact
        env:
          COMMIT: ${{ needs.build.outputs.commit }}
          REQUESTED: ${{ needs.build.outputs.commit }}
        run: |
          test "$COMMIT" = "$REQUESTED"
          test "$(cat COMMIT)" = "$COMMIT"
          sha256sum --quiet -c MANIFEST.sha256
          listed=$(cut -c67- MANIFEST.sha256 | sort)
          present=$(find . -type f ! -name MANIFEST.sha256 | sort)
          test "$listed" = "$present"
          echo "- Artifact verified for \`$COMMIT\` ($(wc -l < MANIFEST.sha256) files)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pinned Wrangler (no application code involved)
        run: |
          mkdir -p "$RUNNER_TEMP/tool" && cd "$RUNNER_TEMP/tool"
          npm install --no-save --ignore-scripts --no-audit --no-fund "wrangler@${WRANGLER_VERSION}"

      - name: Write fixed production configuration
        working-directory: ${{ runner.temp }}/work
        env:
          CHECKOUT: ${{ env.CHECKOUT_MODE }}
          SENDER: ${{ env.SENDER_MODE }}
        run: |
          cat > wrangler.jsonc <<'EOF'
          {
            "name": "afnan-collection-production",
            "account_id": "b4e142fe9da84ef204eecda2efe4a730",
            "main": "artifact/bundle/worker.js",
            "no_bundle": true,
            "compatibility_date": "2026-11-13",
            "compatibility_flags": ["nodejs_compat"],
            "workers_dev": false,
            "preview_urls": false,
            "routes": [{ "pattern": "afnancollectionkn.com", "custom_domain": true }, { "pattern": "www.afnancollectionkn.com", "custom_domain": true }],
            "assets": { "directory": "artifact/public", "binding": "ASSETS", "run_worker_first": true },
            "observability": { "enabled": true, "traces": { "enabled": true } },
            "vars": {
              "APP_ENV": "production",
              "APP_ORIGIN": "https://afnancollectionkn.com",
              "CHECKOUT_ENABLED": "false",
              "PAYMENT_MODE": "disabled",
              "EMAIL_FROM": "noreply@afnancollectionkn.com",
              "ADMIN_AUTH_MODE": "password",
              "EMAIL_SENDER_VERIFIED": "false"
            },
            "d1_databases": [{ "binding": "DB", "database_name": "afnan-collection-production", "database_id": "73ddfc46-34ba-4733-841d-e4819af0b957", "migrations_dir": "artifact/migrations" }],
            "r2_buckets": [{ "binding": "MEDIA", "bucket_name": "afnan-product-media-production" }, { "binding": "RECEIPTS", "bucket_name": "afnan-payment-receipts-production" }]
          }
          EOF
          # The only variables an operator may choose. Strict mapping; PAYMENT_MODE stays pinned,
          # workers.dev stays off and routes must be exactly the approved custom domains.
          case "$CHECKOUT" in enabled) co=true ;; disabled) co=false ;; *) exit 1 ;; esac
          case "$SENDER" in verified) sv=true ;; unverified) sv=false ;; *) exit 1 ;; esac
          node -e 'const fs=require("fs");const c=JSON.parse(fs.readFileSync("wrangler.jsonc","utf8"));c.vars.CHECKOUT_ENABLED=process.argv[1];c.vars.EMAIL_SENDER_VERIFIED=process.argv[2];const approved=JSON.stringify([{pattern:"afnancollectionkn.com",custom_domain:true},{pattern:"www.afnancollectionkn.com",custom_domain:true}]);if(c.vars.PAYMENT_MODE!=="disabled"||c.vars.ADMIN_AUTH_MODE!=="password"||c.workers_dev!==false||JSON.stringify(c.routes)!==approved)process.exit(2);fs.writeFileSync("wrangler.jsonc",JSON.stringify(c,null,2));console.log("CHECKOUT_ENABLED="+c.vars.CHECKOUT_ENABLED,"EMAIL_SENDER_VERIFIED="+c.vars.EMAIL_SENDER_VERIFIED,"PAYMENT_MODE="+c.vars.PAYMENT_MODE)' "$co" "$sv"
          ls -A

      - name: Refuse to deploy while database migrations are pending
        # Migrations are never applied by this workflow; they stay a separately approved step.
        working-directory: ${{ runner.temp }}/work
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b4e142fe9da84ef204eecda2efe4a730
          WRANGLER_SEND_METRICS: "false"
        run: |
          out=$("$RUNNER_TEMP/tool/node_modules/.bin/wrangler" d1 migrations list DB --remote --config wrangler.jsonc 2>&1) || { echo "$out"; exit 1; }
          if ! printf '%s' "$out" | grep -q "No migrations to apply"; then
            echo "$out"
            echo "::error::This commit has database migrations that are not applied to the target D1. Apply them under a separate approval first."
            exit 1
          fi
          echo "- D1 migrations: none pending" >> "$GITHUB_STEP_SUMMARY"

      - name: Record the live version for rollback
        working-directory: ${{ runner.temp }}/work
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b4e142fe9da84ef204eecda2efe4a730
          WRANGLER_SEND_METRICS: "false"
        run: |
          prev=$("$RUNNER_TEMP/tool/node_modules/.bin/wrangler" deployments status --config wrangler.jsonc 2>&1 | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1 || true)
          echo "- Version live before this deploy (rollback target): \`${prev:-none (first deployment)}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy
        working-directory: ${{ runner.temp }}/work
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b4e142fe9da84ef204eecda2efe4a730
          WRANGLER_SEND_METRICS: "false"
          COMMIT: ${{ needs.build.outputs.commit }}
          REASON: ${{ env.DEPLOY_REASON }}
          CHECKOUT: ${{ env.CHECKOUT_MODE }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set on the afnan-production environment."
            exit 1
          fi
          msg="production ${COMMIT:0:7} checkout=${CHECKOUT}: ${REASON}"
          "$RUNNER_TEMP/tool/node_modules/.bin/wrangler" deploy --config wrangler.jsonc \
            --message "${msg:0:100}" 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          version=$(grep -oE 'Current Version ID: [0-9a-f-]{36}' "$RUNNER_TEMP/deploy.log" | awk '{print $4}')
          test -n "$version"
          {
            echo "### Deployment"
            echo "- Worker: \`afnan-collection-production\` (afnancollectionkn.com + www redirect; no workers.dev)"
            echo "- Commit: \`$COMMIT\`"
            echo "- Version: \`$version\`"
            echo "- Checkout: $CHECKOUT ($(grep -o '"CHECKOUT_ENABLED": "[a-z]*"' wrangler.jsonc)); payments: disabled"
            echo "- Reason: $REASON"
            echo "- Rollback: \`wrangler rollback <previous-version-id>\`"
          } >> "$GITHUB_STEP_SUMMARY"
